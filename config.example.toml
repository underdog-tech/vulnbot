default_slack_channel = "asdfqwer"

# Notion setup is manual: create the history database and any persistent
# pages by hand in Notion, share them with your integration, and paste
# their IDs here. See the README for the full setup walkthrough.
notion_summary_page_id = "insert-pre-created-notion-summary-page-id"
notion_database_id = "insert-pre-created-notion-history-database-id"

# Configure the ecosystems we're reporting on
[[ecosystem]]
label = "Go"
slack_emoji = ":golang:"

[[ecosystem]]
label = "Js"
slack_emoji = ":javascript:"

[[ecosystem]]
label = "Python"
slack_emoji = ":python:"

[[ecosystem]]
label = "Ruby"
slack_emoji = ":ruby:"

# Configure the severities we're reporting on
[[severity]]
label = "Critical"
slack_emoji = ":severity_highest:"

[[severity]]
label = "High"
slack_emoji = ":severity_high:"

[[severity]]
label = "Moderate"
slack_emoji = ":severity_medium:"

[[severity]]
label = "Low"
slack_emoji = ":severity_low:"

[[severity]]
label = "Undefined"
slack_emoji = ":white_check_mark:"

# Configure individual teams to report directly on their work
[[team]]
name = "Some Team"
github_slug = "some-team"
slack_channel = "abcdefgh"
# Optional: omit this if the team doesn't want a persistent Notion page.
# They'll still show up as rows in the shared history database.
notion_page_id = "insert-pre-created-notion-page-id-for-this-team"